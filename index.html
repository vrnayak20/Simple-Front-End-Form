<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juice Shop - Login</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; background-color: #f4f4f4; }
        .login-container { background: white; padding: 20px; border-radius: 5px; max-width: 300px; margin: auto; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #546e7a; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; font-size: 0.9em; display: none; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
        <label for="email">Email</label>
        <input type="text" id="email" name="email">
        <div id="emailError" class="error">Please enter a valid email containing '@'.</div>

        <label for="password">Password</label>
        <input type="password" id="password" name="password">
        <div id="passwordError" class="error">Password must be at least 8 characters long.</div>

        <button type="submit">Log In</button>
    </form>
    <div id="successMessage" style="color: green; display: none; margin-top: 10px;">Validation passed! Data ready for server.</div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault(); 
        
        let email = document.getElementById('email').value;
        let password = document.getElementById('password').value;
        let emailError = document.getElementById('emailError');
        let passwordError = document.getElementById('passwordError');
        let successMessage = document.getElementById('successMessage');
        
        let isValid = true;

        if (!email || !email.includes('@')) {
            emailError.style.display = 'block';
            isValid = false;
        } else {
            emailError.style.display = 'none';
        }

        if (!password || password.length < 8) {
            passwordError.style.display = 'block';
            isValid = false;
        } else {
            passwordError.style.display = 'none';
        }

        if (isValid) {
            successMessage.style.display = 'block';
        } else {
            successMessage.style.display = 'none';
        }
    });
</script>

</body>
</html>
