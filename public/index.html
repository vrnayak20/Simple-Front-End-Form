<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juice Shop - Login</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; background-color: #f4f4f4; }
        .login-container { background: white; padding: 25px; border-radius: 6px; max-width: 320px; margin: auto; box-shadow: 0px 2px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 15px; background-color: #546e7a; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        .error { color: #d32f2f; font-size: 0.85em; display: none; margin-bottom: 5px; }
        .status { margin-top: 15px; font-size: 0.9em; display: none; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
        <label for="email">Email</label>
        <input type="text" id="email" name="email">
        <div id="emailError" class="error">Please enter a valid email containing '@'.</div>

        <label for="password">Password</label>
        <input type="password" id="password" name="password">
        <div id="passwordError" class="error">Password must be at least 8 characters.</div>

        <button type="submit">Log In</button>
    </form>
    <div id="serverStatus" class="status"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const serverStatus = document.getElementById('serverStatus');

        let isValid = true;

        // 1. Client-side checks
        if (!email || !email.includes('@')) {
            emailError.style.display = 'block';
            isValid = false;
        } else {
            emailError.style.display = 'none';
        }

        if (!password || password.length < 8) {
            passwordError.style.display = 'block';
            isValid = false;
        } else {
            passwordError.style.display = 'none';
        }

        if (!isValid) return;

        // 2. Dispatch to Server-Side Validator
        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            serverStatus.style.display = 'block';
            if (response.ok) {
                serverStatus.style.color = '#2e7d32';
                serverStatus.textContent = data.message;
            } else {
                serverStatus.style.color = '#d32f2f';
                serverStatus.textContent = `Server Error: ${data.error}`;
            }
        } catch (err) {
            serverStatus.style.display = 'block';
            serverStatus.style.color = '#d32f2f';
            serverStatus.textContent = 'Server is unreachable.';
        }
    });
</script>

</body>
</html>
